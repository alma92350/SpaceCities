name: tests

on:
  push:
  pull_request:

# Cancel a run that a newer push has already superseded — but ONLY on a branch that is not the
# default one.
#
# The asymmetry is the point. On a feature branch, an in-flight run for a commit you have already
# replaced is answering a question nobody is asking any more, and cancelling it frees the runner
# for the commit you actually care about. On main it is the opposite: this project pushes directly
# to main, several times a day, and a cancelled run leaves a commit on the permanent history with
# no verdict — so a later bisect cannot say which of five commits turned the suite red, which is
# exactly when you most want to know. Every commit on main gets its own answer.
#
# This is about runner queueing and feedback latency, not cost: Actions minutes are free and
# unlimited for a public repository, so there is nothing here to save by skipping a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 only, and the narrowing is a correction rather than a retreat.
        #
        # This read [20, 22] against a package.json that claimed ">=20". That claim was false:
        # net/wsClientTransport.js and net/wsSpectatorTransport.js construct a global `WebSocket`,
        # which Node exposes only from 22 (on 20 it exists solely behind --experimental-websocket).
        # So on Node 20 the multiplayer client cannot connect at all, and the tests for it do not
        # fail cleanly — they HANG, awaiting a connection that can never open, until the job's own
        # timeout. Observed: `tests (node 20)` ran 36 minutes while `tests (node 22)` finished the
        # identical suite in 72 seconds. A leg that can only ever hang is worse than no leg, because
        # a run that never concludes reads as "CI is broken" rather than "that version is not
        # supported" — which is precisely how it was read.
        #
        # 22 is also what actually ships: the Dockerfile is FROM node:22-slim. So the matrix, the
        # engines field and the deployed image now say the same thing, and test/runtime-floor.test.js
        # asserts they keep saying it.
        #
        # WHY NOT ADD 24 to keep two legs. Because it is not currently true either, and adding it
        # would recreate this exact situation with a different number. On Node 24 every test passes,
        # but four files (httpServer, wsReconnect, wsTransport, wsWorkerTransport) leave a handle
        # open and the process never exits — a real cleanup bug in those tests, worth fixing on its
        # own terms, and worth adding a 24 leg the day it is fixed. Not before.
        node-version: [22]
    name: tests (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # No dependencies to install — the game and its test suite run on the Node
      # standard library alone, which is the whole point. Just run the tests.
      - name: Run the engine test suite
        run: npm test
      # CONTRIBUTING.md's release checklist requires `npm run typecheck` (tsc -p jsconfig.json)
      # to pass, but no CI step ever ran it. TypeScript stays out of package.json — this repo is
      # explicitly "No dependencies, no build step" — so fetch the compiler on-demand via npx
      # instead of installing it. `--package typescript` names the package explicitly so this
      # works correctly on a clean runner regardless of any ambient global `tsc`, unlike a bare
      # `npx tsc` (which depends on npx's registry-matching behavior).
      #
      # THE VERSION IS PINNED, and that part is load-bearing. Unpinned, `--package typescript`
      # resolves to whatever is newest on the registry that morning, so a green commit can go red
      # overnight with no code change and a real regression is indistinguishable from a compiler
      # upgrade. That is not hypothetical here: TypeScript 7 reported 21 errors on a tree that
      # TypeScript 5.7 reported 2 on, and CI stayed red across two merges to main. Pinning the
      # INVOCATION keeps the compiler out of package.json exactly as the note above intends —
      # it is still not a dependency, it is just no longer a moving target. Bump this
      # deliberately, in its own commit, so a compiler upgrade is reviewable on its own.
      - name: Type-check the annotated files
        run: npx --yes --package typescript@5.7.2 -- tsc -p jsconfig.json

  # The long half of the ailab guards, as its own job.
  #
  # These 72 tests drive real matches and take ~4 minutes; the other ~3200 tests in the repo take
  # under 25 seconds combined. Leaving them in `npm test` meant every `npm test` — the command
  # CONTRIBUTING.md tells a contributor to run on every change — was gated end to end on an
  # AI-tuning sweep that almost no commit can affect, and a red-green loop measured in minutes is
  # a loop people quietly stop running.
  #
  # A SEPARATE JOB, NOT A SKIP. Nothing here is optional or conditional: it runs on every push and
  # every pull request, exactly like the fast suite, and belongs in the required-checks list in
  # CONTRIBUTING.md. It is only taken off the critical path of the inner loop, not out of the
  # build. test/suite-integrity.test.js pins the arrangement from the other side, so the slow half
  # cannot become an empty directory that passes vacuously.
  #
  # ONE NODE VERSION, deliberately. These tests exercise the sim, which the fast matrix already
  # covers on both LTS lines; running four minutes of sweeps twice would cost eight to learn the
  # same thing.
  slow:
    runs-on: ubuntu-latest
    name: slow tests (ailab sweeps)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run the long-running bench guards
        run: npm run test:slow

  # The suite above is headless and dependency-free, which is the whole point of it — and it means
  # nothing in it can see a page that parses, imports cleanly, and then throws on load. With no
  # build step that failure is a blank white screen, and the way it has been caught here before is
  # a human opening index.html. Demonstrated: a bad draw call in renderUnits.js leaves all 2502
  # tests passing and takes the game down on the first frame.
  #
  # So: one job that boots the real page in real Chromium, starts a match, clicks, and fails on any
  # uncaught error. Playwright is fetched at run time via npx and never enters package.json —
  # exactly the precedent the type-check step set for TypeScript. It is a separate job rather than
  # a matrix step because it tests the BROWSER, not the Node version; running it twice would just
  # cost two Chromium downloads to learn the same thing.
  smoke:
    runs-on: ubuntu-latest
    name: browser smoke test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # --no-save: Playwright is installed for this checkout only and never enters package.json,
      # so the repo keeps its zero-dependency promise. `npx --package playwright -- node ...` is
      # the tidier-looking version of this and does NOT work — npx puts the package's BIN on PATH
      # but not its module on a child node process's resolution path, so the script's own require
      # fails. That shipped broken once; this is the verified form.
      #
      # The FULL playwright package, not playwright-core: only the full one carries the CLI that
      # downloads browsers. Pinned for the same reason the compiler is — a gate that moves
      # underneath you cannot tell a regression from an upgrade. Chromium only; the bare
      # `playwright install` pulls three browsers this never launches.
      - name: Install Playwright and Chromium (never saved to package.json)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Boot the game in a real browser
        run: npm run smoke
      # A SECOND step in this job rather than a job of its own, for two reasons: Chromium is
      # already installed here (a separate job would download it again to learn the same thing),
      # and the branch ruleset names its required checks one per JOB — so a new job would silently
      # not be required until somebody remembered to add it, which is the exact failure mode
      # CONTRIBUTING.md's protection section is about. As a step, it is covered by the
      # `browser smoke test` check that is already required.
      #
      # What it adds: two browsers, one server, a real shared link. Everything multiplayer is
      # tested one layer down over real sockets in Node, and the single-page smoke test above
      # plays a skirmish — between them sits the path a real player takes, and it was uncovered.
      # It caught a live-match autosave crash on its first run.
      - name: Two browsers, one shared link — the real multiplayer path
        run: npm run smoke:mp
